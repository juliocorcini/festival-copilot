name = "festpilot"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Lineup ingestion runs on a schedule (resolve -> fetch -> detect -> diff -> upsert -> bump revision).
# Every 6 hours is plenty for a lineup that changes rarely; cheap to run.
[triggers]
crons = ["0 */6 * * *"]

[vars]
# The official page whose __NEXT_DATA__ carries the lineup source ref (event + uuid).
# The ref is resolved at runtime and NEVER hardcoded (see src/lineup/resolver.ts).
LINEUP_PAGE_URL = "https://belgium.tomorrowland.com/en/line-up/?page=timetable"
FESTIVAL_NAME = "Tomorrowland Belgium 2026"
FESTIVAL_SLUG = "tomorrowland-belgium-2026"
FESTIVAL_TIMEZONE = "Europe/Brussels"
# Saved source ref (documented fallback chain, research §6). The page is resolved FIRST every
# run; these are used ONLY if it's unreachable (WAF 403 on Worker egress). A changed uuid is
# still detected whenever the page is reachable (DEC-009). Confirmed by the ingestion spike.
LINEUP_EVENT = "TL26BE"
LINEUP_UUID = "9205196e-3eef-45c0-a82e-72aa1bb3cf8f"

# D1: created 2026-06-23 (region WEUR) via `npm run db:create`.
[[d1_databases]]
binding = "DB"
database_name = "festpilot"
database_id = "e6753623-2b4e-41ce-9725-4bd417966cfa"
migrations_dir = "migrations"

# Per-group realtime fan-out (DEC-037). GroupRoom uses the SQLite storage backend — the only
# Durable Object backend on the Workers Free plan, so this is $0 for V1.
[[durable_objects.bindings]]
name = "GROUP_ROOM"
class_name = "GroupRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupRoom"]

# ADMIN_TOKEN is a secret (guards POST /admin/ingest). Set with:
#   wrangler secret put ADMIN_TOKEN
# For local dev, put it in .dev.vars (gitignored).
