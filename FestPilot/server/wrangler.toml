name = "festpilot"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Lineup ingestion runs on a schedule (resolve -> fetch -> detect -> diff -> upsert -> bump revision).
# Every 6 hours is plenty for a lineup that changes rarely; cheap to run.
[triggers]
crons = ["0 */6 * * *"]

[vars]
# The official page whose __NEXT_DATA__ carries the lineup source ref (event + uuid).
# The ref is resolved at runtime and NEVER hardcoded (see src/lineup/resolver.ts).
LINEUP_PAGE_URL = "https://belgium.tomorrowland.com/en/line-up/?page=timetable"
FESTIVAL_NAME = "Tomorrowland Belgium 2026"
FESTIVAL_SLUG = "tomorrowland-belgium-2026"
FESTIVAL_TIMEZONE = "Europe/Brussels"

# D1: run `npm run db:create` once and paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "festpilot"
database_id = "REPLACE_WITH_DATABASE_ID"
migrations_dir = "migrations"

# ADMIN_TOKEN is a secret (guards POST /admin/ingest). Set with:
#   wrangler secret put ADMIN_TOKEN
# For local dev, put it in .dev.vars (gitignored).
