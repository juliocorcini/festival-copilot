<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>T2 · Horizontal Lanes Refined — FestPilot Timetable</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D09;--accent:#F5A623;--accent2:#FFD060;--ink:#F5F0E6;--muted:#9C9080;--glass:rgba(255,190,60,.06);--border:rgba(255,255,255,.1);--danger:#E0563B;--ok:#16A34A}
*{box-sizing:border-box}
body{background:#08070a;font-family:"Albert Sans",system-ui,sans-serif;color:var(--ink);margin:0}
.poster{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.ms{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 400;line-height:1}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none;-ms-overflow-style:none}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 50px 100px -30px rgba(245,166,35,.25);display:flex;flex-direction:column}
.head{padding:36px 18px 2px;flex-shrink:0}
.pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
.pill.ghost{background:var(--glass);border:1px solid var(--border);color:var(--ink)}
.pill.on{background:var(--accent);color:var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 22px;flex-shrink:0;background:rgba(15,13,9,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
.navitem{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer}
.navitem .ms{font-size:23px}.navitem.active{color:var(--accent)}

.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 18px 8px;flex-shrink:0}
.ctl-l{display:flex;gap:6px}
.lockin{font-weight:800;color:var(--bg);border:none;background:linear-gradient(135deg,var(--accent),var(--accent2))}

.tt-scroll{flex:1;min-height:0;overflow:auto;position:relative}
.tt-content{position:relative;width:980px;padding:0 0 14px}
.time-row{position:sticky;top:0;z-index:30;height:28px;background:linear-gradient(180deg,var(--bg) 72%,transparent)}
.time-row .t{position:absolute;top:8px;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.time-row .t.now{color:var(--accent)}
.grid{position:absolute;top:28px;left:0;right:0;bottom:0;z-index:0;pointer-events:none}
.grid .gl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.05)}
.grid .gl.half{background:rgba(255,255,255,.024)}
.stage{position:relative;margin-bottom:11px}
.stage-name{position:sticky;left:10px;z-index:25;display:inline-flex;align-items:center;gap:7px;margin-bottom:5px;padding:4px 11px 4px 9px;border-radius:99px;
  background:rgba(20,17,12,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);box-shadow:0 2px 10px -4px rgba(0,0,0,.6)}
.stage-name .pin{width:8px;height:8px;border-radius:50%}
.stage-name .nm{font-size:10px;font-weight:800;letter-spacing:.05em}
.stage-name .ct{font-size:9px;font-weight:700;color:var(--muted)}
.stage-name .ct b{color:var(--accent)}
.track{position:relative;width:100%;height:62px}
.set{position:absolute;top:0;bottom:0;border-radius:13px;padding-right:42px;cursor:pointer;
  background:radial-gradient(130% 80% at 0 0,rgba(255,255,255,.10),transparent 46%),rgba(22,19,14,.5);
  border:1px solid rgba(255,255,255,.1);border-top:2px solid rgb(var(--c));
  box-shadow:0 8px 18px -12px rgba(0,0,0,.7);backdrop-filter:blur(14px)}
.set.live{box-shadow:0 0 0 1.5px var(--accent),0 8px 18px -12px rgba(0,0,0,.7)}
.set.fav{color:#1a1205;background:radial-gradient(130% 80% at 0 0,rgba(255,255,255,.28),transparent 46%),linear-gradient(135deg,rgba(255,216,128,.96),rgba(245,166,35,.84));
  border:1px solid rgba(255,222,150,.9);border-top:2px solid rgb(var(--c));box-shadow:0 0 16px rgba(245,166,35,.3),0 8px 16px -12px rgba(0,0,0,.7)}
.set-inner{position:sticky;left:0;display:inline-flex;align-items:center;gap:9px;height:100%;padding:0 8px 0 10px;width:max-content;max-width:100%}
.photo{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
  background:linear-gradient(135deg,#3a3224,#241f16);color:#cbb78e;border:1px solid rgba(255,255,255,.12)}
.set.fav .photo{background:linear-gradient(135deg,#fff,#f1dca8);color:#7a5a10;border:1px solid rgba(0,0,0,.1)}
.info{min-width:0;overflow:hidden}
.set .name{font-size:12px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .meta{font-size:9.5px;opacity:.62;margin-top:1px;white-space:nowrap}
.set.fav .meta{opacity:.78}
.heart{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:4;width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:rgba(30,26,18,.6);border:1px solid rgba(255,255,255,.18);color:var(--accent);backdrop-filter:blur(8px)}
.heart .ms{font-size:16px}
.set.fav .heart{background:rgba(0,0,0,.1);border-color:rgba(0,0,0,.14);color:#8a4500}
.now-line{position:absolute;top:28px;bottom:0;width:2px;background:var(--accent);z-index:15;box-shadow:0 0 10px rgba(245,166,35,.7)}
.now-line::before{content:"NOW 22:40";position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:800;color:#0F0D09;background:var(--accent);padding:1px 6px;border-radius:99px;white-space:nowrap}
.jump{position:absolute;right:14px;bottom:14px;z-index:40;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--bg);
  background:linear-gradient(135deg,var(--accent),var(--accent2));padding:8px 13px;border-radius:99px;box-shadow:0 8px 20px -6px rgba(245,166,35,.6);cursor:pointer}
.content.filtered .stage:not(.has-fav){display:none}.content.filtered .set:not(.fav){display:none}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
<div class="phone">
  <div class="head">
    <div class="flex items-center justify-between">
      <h1 class="poster text-[22px] font-bold">Timetable</h1>
      <div class="flex gap-1.5"><span class="pill on">Sat 18</span><span class="pill ghost">Sun 19</span></div>
    </div>
  </div>
  <div class="ctl">
    <div class="ctl-l">
      <span class="pill ghost" id="zoomT"><span class="ms text-[14px]">zoom_in</span><span id="zoomL">2h view</span></span>
      <span class="pill ghost" id="favT"><span class="ms text-[14px]">favorite</span>Only favs</span>
    </div>
    <span class="pill lockin"><span class="ms text-[14px]">lock</span>Lock in</span>
  </div>
  <div class="tt-scroll" id="scroll">
    <div class="tt-content content" id="content"></div>
    <div class="jump" id="jump"><span class="ms text-[14px]">my_location</span>Now</div>
  </div>
  <div class="nav">
    <div class="navitem"><span class="ms">bolt</span>Now</div>
    <div class="navitem active"><span class="ms">calendar_month</span>Timetable</div>
    <div class="navitem"><span class="ms">event_available</span>My Plan</div>
    <div class="navitem"><span class="ms">map</span>Map</div>
    <div class="navitem"><span class="ms">group</span>Squad</div>
  </div>
</div>
<script>
const STAGES=[
 {name:"MAINSTAGE",color:"#FF5A36",sets:[{a:"Charlotte de Witte",s:"21:00",e:"23:00",fav:true,i:"CW"},{a:"Dimitri Vegas",s:"23:15",e:"01:00",i:"DV"},{a:"Steve Aoki",s:"01:15",e:"03:00",i:"SA"}]},
 {name:"FREEDOM",color:"#0EA5E9",sets:[{a:"Maceo Plex",s:"21:00",e:"22:45",i:"MP"},{a:"Adam Beyer",s:"23:00",e:"01:00",fav:true,i:"AB"},{a:"Pig&Dan",s:"01:30",e:"03:00",i:"PD"}]},
 {name:"CAGE",color:"#F59E0B",sets:[{a:"Lilly Palmer",s:"21:00",e:"22:30",i:"LP"},{a:"Amelie Lens",s:"23:15",e:"00:30",fav:true,i:"AL"},{a:"FJAAK",s:"00:45",e:"02:00",i:"FJ"}]},
 {name:"CORE",color:"#16A34A",sets:[{a:"Ben Böhmer",s:"21:00",e:"22:30",i:"BB"},{a:"Stephan Bodzin",s:"22:45",e:"00:15",i:"SB"},{a:"Reinier Z.",s:"00:30",e:"02:00",i:"RZ"}]},
 {name:"ELIXIR",color:"#7C3AED",sets:[{a:"Adriatique",s:"21:00",e:"23:00",i:"AD"},{a:"Tale Of Us",s:"23:15",e:"01:30",fav:true,i:"TU"},{a:"Innellea",s:"01:45",e:"03:00",i:"IN"}]},
 {name:"ROSE GARDEN",color:"#EC4899",sets:[{a:"Sofi Tukker",s:"21:00",e:"22:30",i:"ST"},{a:"Peggy Gou",s:"22:45",e:"00:30",fav:true,i:"PG"},{a:"Honey Dijon",s:"00:45",e:"02:30",i:"HD"}]},
 {name:"RISE",color:"#EAB308",sets:[{a:"Hardwell",s:"21:30",e:"23:30",i:"HW"},{a:"Martin Garrix",s:"23:45",e:"01:30",fav:true,i:"MG"}]},
 {name:"ATMOSPHERE",color:"#06B6D4",sets:[{a:"Boris Brejcha",s:"21:30",e:"23:15",i:"BR"},{a:"Solomun",s:"23:30",e:"01:30",i:"SO"}]}
];
const WIN_START=21*60,WIN_END=27*60,NOW=22*60+40;
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)].join(",");
const toMin=t=>{let[h,m]=t.split(":").map(Number);if(h<12)h+=24;return h*60+m;};
const pct=min=>(min-WIN_START)/(WIN_END-WIN_START)*100;
const content=document.getElementById("content");
let tr='<div class="time-row">';
for(let h=21;h<=27;h++){const isNow=NOW>=h*60&&NOW<(h+1)*60;tr+=`<span class="t${isNow?" now":""}" style="left:${pct(h*60)}%">${String(h%24).padStart(2,"0")}:00</span>`;}
tr+='</div><div class="grid">';
for(let m=WIN_START;m<=WIN_END;m+=30) tr+=`<div class="gl${(m/30)%2?" half":""}" style="left:${pct(m)}%"></div>`;
tr+='</div>';
let html=tr+`<div class="now-line" style="left:${pct(NOW)}%"></div>`;
STAGES.forEach(st=>{const favN=st.sets.filter(x=>x.fav).length;
  html+=`<div class="stage${favN?" has-fav":""}"><div class="stage-name"><span class="pin" style="background:${st.color}"></span><span class="nm" style="color:${st.color}">${st.name}</span><span class="ct">${st.sets.length} sets${favN?` · <b>${favN}★</b>`:""}</span></div><div class="track">`;
  st.sets.forEach(se=>{const l=pct(toMin(se.s)),w=pct(toMin(se.e))-l,live=NOW>=toMin(se.s)&&NOW<toMin(se.e);
    html+=`<div class="set${se.fav?" fav":""}${live?" live":""}" data-fav="${!!se.fav}" style="--c:${rgb(st.color)};left:${l}%;width:calc(${w}% - 3px)">
      <div class="set-inner"><div class="photo">${se.i}</div><div class="info"><div class="name">${se.a}</div><div class="meta">${se.s} – ${se.e}</div></div></div>
      <button class="heart"><span class="ms">${se.fav?"favorite":"favorite_border"}</span></button></div>`;});
  html+='</div></div>';});
content.innerHTML=html;
content.querySelectorAll(".heart").forEach(h=>h.addEventListener("click",e=>{e.stopPropagation();const c=h.closest(".set");const on=c.classList.toggle("fav");c.dataset.fav=on;h.querySelector(".ms").textContent=on?"favorite":"favorite_border";const stg=c.closest(".stage");stg.classList.toggle("has-fav",!!stg.querySelector(".set.fav"));}));
const favT=document.getElementById("favT");favT.addEventListener("click",()=>{const on=content.classList.toggle("filtered");favT.classList.toggle("on",on);favT.classList.toggle("ghost",!on);});
const zoomT=document.getElementById("zoomT"),zoomL=document.getElementById("zoomL");let z="2h";
zoomT.addEventListener("click",()=>{z=z==="2h"?"1h":"2h";content.style.width=z==="1h"?"1960px":"980px";zoomL.textContent=z+" view";});
const scroll=document.getElementById("scroll");function jumpNow(){scroll.scrollTo({left:content.offsetWidth*pct(NOW)/100-150,behavior:"smooth"});}
document.getElementById("jump").addEventListener("click",jumpNow);setTimeout(jumpNow,200);
</script>
</body>
</html>
