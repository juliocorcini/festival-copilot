<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>T9 · Editorial Poster — FestPilot Timetable</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D09;--accent:#F5A623;--accent2:#FFD060;--ink:#F5F0E6;--muted:#9C9080;--glass:rgba(255,190,60,.06);--border:rgba(255,255,255,.1);--danger:#E0563B;--ok:#16A34A}
*{box-sizing:border-box}
body{background:#08070a;font-family:"Albert Sans",system-ui,sans-serif;color:var(--ink);margin:0}
.poster{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.ms{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 400;line-height:1}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none;-ms-overflow-style:none}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 50px 100px -30px rgba(245,166,35,.25);display:flex;flex-direction:column}
.head{padding:36px 18px 4px;flex-shrink:0}
.pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
.pill.ghost{background:var(--glass);border:1px solid var(--border);color:var(--ink)}
.pill.on{background:var(--accent);color:var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 22px;flex-shrink:0;background:rgba(15,13,9,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
.navitem{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer}
.navitem .ms{font-size:23px}.navitem.active{color:var(--accent)}

.body{flex:1;min-height:0;overflow:auto;padding:4px 16px 16px}
.band{margin-top:14px}
.band-h{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
.band-h .t{font-family:"Oswald";font-size:19px;font-weight:700}
.band-h .r{font-size:11px;font-weight:700;color:var(--muted)}
.band-h .line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.tiles{display:flex;flex-wrap:wrap;gap:9px}
.tile{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;padding:11px}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0,rgba(255,255,255,.16),transparent 50%)}
.tile .rel{position:relative;z-index:2}
.tile .stg{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.tile .nm{font-family:"Oswald";font-weight:700;line-height:.98;margin-top:2px}
.tile .tm{font-size:10px;font-weight:600;opacity:.82;margin-top:4px}
.tile .heart{position:absolute;top:9px;right:9px;z-index:3;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.25);color:#fff}
.tile .heart .ms{font-size:16px}
.feature{width:100%;min-height:116px}
.feature .nm{font-size:27px}
.feature .heart{color:var(--accent2)}
.mini{width:calc(50% - 4.5px);min-height:96px}
.mini .nm{font-size:16px}
.mini::before{content:"";position:absolute;inset:0;background:rgba(15,13,9,.32)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
<div class="phone">
  <div class="head">
    <div class="flex items-center justify-between">
      <div><h1 class="poster text-[22px] font-bold leading-none">Line-up</h1><span class="text-[11px] text-[var(--muted)] font-semibold">Tomorrowland · Sat 18</span></div>
      <span class="pill ghost" id="favT"><span class="ms text-[14px]">favorite</span>My picks</span>
    </div>
  </div>
  <div class="body" id="body"></div>
  <div class="nav">
    <div class="navitem"><span class="ms">bolt</span>Now</div>
    <div class="navitem active"><span class="ms">calendar_month</span>Timetable</div>
    <div class="navitem"><span class="ms">event_available</span>My Plan</div>
    <div class="navitem"><span class="ms">map</span>Map</div>
    <div class="navitem"><span class="ms">group</span>Squad</div>
  </div>
</div>
<script>
const STAGES=[
 {name:"MAINSTAGE",color:"#FF5A36",sets:[{a:"Charlotte de Witte",s:"21:00",e:"23:00",fav:true,i:"CW"},{a:"Dimitri Vegas",s:"23:15",e:"01:00",i:"DV"},{a:"Steve Aoki",s:"01:15",e:"03:00",i:"SA"}]},
 {name:"FREEDOM",color:"#0EA5E9",sets:[{a:"Maceo Plex",s:"21:00",e:"22:45",i:"MP"},{a:"Adam Beyer",s:"23:00",e:"01:00",fav:true,i:"AB"},{a:"Pig&Dan",s:"01:30",e:"03:00",i:"PD"}]},
 {name:"CAGE",color:"#F59E0B",sets:[{a:"Lilly Palmer",s:"21:00",e:"22:30",i:"LP"},{a:"Amelie Lens",s:"23:15",e:"00:30",fav:true,i:"AL"},{a:"FJAAK",s:"00:45",e:"02:00",i:"FJ"}]},
 {name:"CORE",color:"#16A34A",sets:[{a:"Ben Böhmer",s:"21:00",e:"22:30",i:"BB"},{a:"Stephan Bodzin",s:"22:45",e:"00:15",i:"SB"},{a:"Reinier Z.",s:"00:30",e:"02:00",i:"RZ"}]},
 {name:"ELIXIR",color:"#7C3AED",sets:[{a:"Adriatique",s:"21:00",e:"23:00",i:"AD"},{a:"Tale Of Us",s:"23:15",e:"01:30",fav:true,i:"TU"},{a:"Innellea",s:"01:45",e:"03:00",i:"IN"}]},
 {name:"ROSE GARDEN",color:"#EC4899",sets:[{a:"Sofi Tukker",s:"21:00",e:"22:30",i:"ST"},{a:"Peggy Gou",s:"22:45",e:"00:30",fav:true,i:"PG"},{a:"Honey Dijon",s:"00:45",e:"02:30",i:"HD"}]},
 {name:"RISE",color:"#EAB308",sets:[{a:"Hardwell",s:"21:30",e:"23:30",i:"HW"},{a:"Martin Garrix",s:"23:45",e:"01:30",fav:true,i:"MG"}]},
 {name:"ATMOSPHERE",color:"#06B6D4",sets:[{a:"Boris Brejcha",s:"21:30",e:"23:15",i:"BR"},{a:"Solomun",s:"23:30",e:"01:30",i:"SO"}]}
];
const toMin=t=>{let[h,m]=t.split(":").map(Number);if(h<12)h+=24;return h*60+m;};
const tint=(hex,a)=>`rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
let all=[];STAGES.forEach(st=>st.sets.forEach(se=>all.push({...se,stage:st.name,color:st.color,sm:toMin(se.s)})));
const BANDS=[{t:"Golden Hour",sub:"21–23",lo:21*60,hi:23*60},{t:"Prime Time",sub:"23–01",lo:23*60,hi:25*60},{t:"Afters",sub:"01–03",lo:25*60,hi:28*60}];
const body=document.getElementById("body");let html="";
BANDS.forEach(b=>{const items=all.filter(x=>x.sm>=b.lo&&x.sm<b.hi).sort((p,q)=>(q.fav?1:0)-(p.fav?1:0)||p.sm-q.sm);
  html+=`<div class="band"><div class="band-h"><span class="t">${b.t}</span><span class="r">${b.sub}</span><span class="line"></span><span class="r">${items.length}</span></div><div class="tiles">`;
  items.forEach(x=>{const feat=x.fav;
    const bg=feat?`linear-gradient(145deg,${tint(x.color,.95)},${tint(x.color,.4)})`:`linear-gradient(150deg,${tint(x.color,.8)},${tint(x.color,.32)})`;
    html+=`<div class="tile ${feat?"feature":"mini"}" data-fav="${!!x.fav}" style="background:${bg}">
      <button class="heart"><span class="ms">${x.fav?"favorite":"favorite_border"}</span></button>
      <div class="rel"><div class="stg">${x.stage}</div><div class="nm">${x.a}</div><div class="tm">${x.s} – ${x.e}</div></div></div>`;});
  html+=`</div></div>`;});
body.innerHTML=html;
body.querySelectorAll(".heart").forEach(h=>h.addEventListener("click",e=>{e.stopPropagation();const t=h.closest(".tile");const on=!(t.dataset.fav==="true");t.dataset.fav=on;h.querySelector(".ms").textContent=on?"favorite":"favorite_border";h.style.color=on?"var(--accent2)":"#fff";}));
const favT=document.getElementById("favT");let only=false;
favT.addEventListener("click",()=>{only=!only;favT.classList.toggle("on",only);favT.classList.toggle("ghost",!only);
  body.querySelectorAll(".tile").forEach(t=>t.style.display=only&&t.dataset.fav!=="true"?"none":"");});
</script>
</body>
</html>
