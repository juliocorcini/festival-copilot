<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>T4 · My Day Spine — FestPilot Timetable</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D09;--accent:#F5A623;--accent2:#FFD060;--ink:#F5F0E6;--muted:#9C9080;--glass:rgba(255,190,60,.06);--border:rgba(255,255,255,.1);--danger:#E0563B;--ok:#16A34A}
*{box-sizing:border-box}
body{background:#08070a;font-family:"Albert Sans",system-ui,sans-serif;color:var(--ink);margin:0}
.poster{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.ms{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 400;line-height:1}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none;-ms-overflow-style:none}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 50px 100px -30px rgba(245,166,35,.25);display:flex;flex-direction:column}
.head{padding:36px 18px 8px;flex-shrink:0}
.pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
.pill.ghost{background:var(--glass);border:1px solid var(--border);color:var(--ink)}
.pill.on{background:var(--accent);color:var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 22px;flex-shrink:0;background:rgba(15,13,9,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
.navitem{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer}
.navitem .ms{font-size:23px}.navitem.active{color:var(--accent)}

.summ{display:flex;gap:8px;margin:2px 18px 4px}
.stat{flex:1;border-radius:14px;padding:9px 11px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),rgba(20,17,12,.5);border:1px solid var(--border)}
.stat .v{font-family:"Oswald";font-size:20px;font-weight:700;line-height:1}
.stat .k{font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-top:3px;text-transform:uppercase}
.stat.warn{border-color:rgba(224,86,59,.4)}.stat.warn .v{color:#f08a73}

.spine{flex:1;min-height:0;overflow:auto;position:relative;padding:8px 0 16px}
.spine::before{content:"";position:absolute;top:8px;bottom:16px;left:50%;width:2px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(245,166,35,.55),rgba(245,166,35,.12))}
.node{position:relative;display:flex;align-items:center;min-height:74px;padding:0 14px}
.node .dot{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--bg);z-index:4;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.card{width:calc(50% - 22px);border-radius:15px;padding:9px 11px;display:flex;gap:9px;align-items:center;
  background:linear-gradient(135deg,rgba(245,166,35,.16),rgba(255,208,96,.03)),rgba(20,17,12,.55);
  border:1px solid rgba(245,166,35,.4);backdrop-filter:blur(12px);box-shadow:0 8px 20px -14px rgba(0,0,0,.8)}
.node.r{justify-content:flex-end}
.node.l .card{flex-direction:row-reverse;text-align:right}
.card .photo{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:linear-gradient(135deg,#fff,#f1dca8);color:#7a5a10}
.card .nm{font-size:12.5px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{font-size:9px;font-weight:800;letter-spacing:.04em;margin-top:2px}
.card .tm{font-size:10px;color:var(--muted);font-weight:600;margin-top:1px}
.conn{position:relative;display:flex;justify-content:center;height:30px;align-items:center}
.chip{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:4px;z-index:3;
  background:rgba(20,17,12,.9);border:1px solid var(--border);color:var(--muted);backdrop-filter:blur(8px)}
.chip .ms{font-size:12px}
.chip.clash{color:#f08a73;border-color:rgba(224,86,59,.5);background:rgba(40,16,12,.92)}
.foot{flex-shrink:0;padding:0 16px}
.cta{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:800;color:var(--bg);padding:12px;border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 24px -8px rgba(245,166,35,.55);cursor:pointer}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
<div class="phone">
  <div class="head">
    <div class="flex items-center justify-between">
      <h1 class="poster text-[22px] font-bold">Your day</h1>
      <span class="pill ghost"><span class="ms text-[14px]">visibility</span>Show all</span>
    </div>
    <p class="text-[11px] text-[var(--muted)] font-semibold mt-1">Just your picks, in order — clashes flagged before you lock in.</p>
  </div>
  <div class="summ">
    <div class="stat"><div class="v">6</div><div class="k">Picks</div></div>
    <div class="stat warn"><div class="v">3</div><div class="k">Clashes</div></div>
    <div class="stat"><div class="v">4</div><div class="k">Stages</div></div>
  </div>
  <div class="spine" id="spine"></div>
  <div class="foot"><div class="cta"><span class="ms text-[16px]">lock</span>Resolve clashes &amp; lock in</div></div>
  <div class="nav">
    <div class="navitem"><span class="ms">bolt</span>Now</div>
    <div class="navitem active"><span class="ms">calendar_month</span>Timetable</div>
    <div class="navitem"><span class="ms">event_available</span>My Plan</div>
    <div class="navitem"><span class="ms">map</span>Map</div>
    <div class="navitem"><span class="ms">group</span>Squad</div>
  </div>
</div>
<script>
const FAVS=[
 {a:"Charlotte de Witte",s:"21:00",e:"23:00",stage:"MAINSTAGE",color:"#FF5A36",i:"CW"},
 {a:"Peggy Gou",s:"22:45",e:"00:30",stage:"ROSE GARDEN",color:"#EC4899",i:"PG"},
 {a:"Adam Beyer",s:"23:00",e:"01:00",stage:"FREEDOM",color:"#0EA5E9",i:"AB"},
 {a:"Amelie Lens",s:"23:15",e:"00:30",stage:"CAGE",color:"#F59E0B",i:"AL"},
 {a:"Tale Of Us",s:"23:15",e:"01:30",stage:"ELIXIR",color:"#7C3AED",i:"TU"},
 {a:"Martin Garrix",s:"23:45",e:"01:30",stage:"RISE",color:"#EAB308",i:"MG"}
];
const WALK={MAINSTAGE:{"ROSE GARDEN":11},"ROSE GARDEN":{FREEDOM:7},FREEDOM:{CAGE:4},CAGE:{ELIXIR:6},ELIXIR:{RISE:9}};
const toMin=t=>{let[h,m]=t.split(":").map(Number);if(h<12)h+=24;return h*60+m;};
FAVS.forEach(f=>{f.sm=toMin(f.s);f.em=toMin(f.e);});
FAVS.sort((a,b)=>a.sm-b.sm);
const spine=document.getElementById("spine");let html="";
FAVS.forEach((f,idx)=>{
  const side=idx%2?"r":"l";
  html+=`<div class="conn">`;
  if(idx>0){const prev=FAVS[idx-1];const overlap=f.sm<prev.em&&prev.sm<f.em;
    if(overlap){html+=`<span class="chip clash"><span class="ms">bolt</span>overlaps ${prev.a.split(" ")[0]} — pick one</span>`;}
    else{const w=(WALK[prev.stage]&&WALK[prev.stage][f.stage])||8;html+=`<span class="chip"><span class="ms">directions_walk</span>${w} min walk</span>`;}}
  html+=`</div>`;
  html+=`<div class="node ${side}"><span class="dot" style="background:${f.color}"></span>
    <div class="card"><div class="photo">${f.i}</div><div style="min-width:0"><div class="nm">${f.a}</div><div class="st" style="color:${f.color}">${f.stage}</div><div class="tm">${f.s} – ${f.e}</div></div></div></div>`;
});
spine.innerHTML=html;
</script>
</body>
</html>
