<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>T5 · Stage Accordion — FestPilot Timetable</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D09;--accent:#F5A623;--accent2:#FFD060;--ink:#F5F0E6;--muted:#9C9080;--glass:rgba(255,190,60,.06);--border:rgba(255,255,255,.1);--danger:#E0563B;--ok:#16A34A}
*{box-sizing:border-box}
body{background:#08070a;font-family:"Albert Sans",system-ui,sans-serif;color:var(--ink);margin:0}
.poster{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.ms{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 400;line-height:1}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none;-ms-overflow-style:none}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 50px 100px -30px rgba(245,166,35,.25);display:flex;flex-direction:column}
.head{padding:36px 18px 6px;flex-shrink:0}
.pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
.pill.ghost{background:var(--glass);border:1px solid var(--border);color:var(--ink)}
.pill.on{background:var(--accent);color:var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 22px;flex-shrink:0;background:rgba(15,13,9,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
.navitem{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer}
.navitem .ms{font-size:23px}.navitem.active{color:var(--accent)}

.body{flex:1;min-height:0;overflow:auto;padding:4px 14px 16px}
.acc{margin-bottom:9px;border-radius:18px;overflow:hidden;border:1px solid var(--border);
  background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),rgba(20,17,12,.5);backdrop-filter:blur(12px)}
.acc.open{border-color:rgba(245,166,35,.35)}
.acc-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.acc-head .pin{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.acc-head .nm{font-family:"Oswald";font-size:15px;font-weight:700;letter-spacing:.02em}
.acc-head .sub{font-size:10px;color:var(--muted);font-weight:700;margin-top:1px}
.acc-head .sub b{color:var(--accent)}
.acc-head .now{font-size:10px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:4px;margin-left:auto;max-width:120px}
.acc-head .now .d{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0;box-shadow:0 0 8px var(--ok)}
.acc-head .chev{margin-left:6px;color:var(--muted);transition:transform .2s}
.acc.open .acc-head .chev{transform:rotate(180deg)}
.acc-body{display:none;padding:0 14px 12px}
.acc.open .acc-body{display:block}
.strip{position:relative;height:30px;border-radius:9px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06);margin-bottom:11px;overflow:hidden}
.strip .blk{position:absolute;top:4px;bottom:4px;border-radius:6px;opacity:.85}
.strip .blk.fav{box-shadow:0 0 0 1.5px var(--accent2)}
.strip .nl{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.srow{display:flex;align-items:center;gap:10px;padding:7px 2px}
.srow+.srow{border-top:1px solid rgba(255,255,255,.05)}
.srow .photo{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:linear-gradient(135deg,#3a3224,#241f16);color:#cbb78e;border:1px solid rgba(255,255,255,.12)}
.srow.fav .photo{background:linear-gradient(135deg,#fff,#f1dca8);color:#7a5a10}
.srow .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .tm{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px}
.srow .heart{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--glass);border:1px solid var(--border);color:var(--muted)}
.srow.fav .heart{color:var(--accent);border-color:rgba(245,166,35,.5)}
.srow .heart .ms{font-size:17px}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
<div class="phone">
  <div class="head">
    <div class="flex items-center justify-between">
      <h1 class="poster text-[22px] font-bold">Timetable</h1>
      <div class="flex gap-1.5"><span class="pill on">Sat 18</span><span class="pill ghost">Sun 19</span></div>
    </div>
    <p class="text-[11px] text-[var(--muted)] font-semibold mt-1 flex items-center gap-1"><span class="ms text-[14px]">unfold_more</span>Tap a stage to open its line-up</p>
  </div>
  <div class="body" id="body"></div>
  <div class="nav">
    <div class="navitem"><span class="ms">bolt</span>Now</div>
    <div class="navitem active"><span class="ms">calendar_month</span>Timetable</div>
    <div class="navitem"><span class="ms">event_available</span>My Plan</div>
    <div class="navitem"><span class="ms">map</span>Map</div>
    <div class="navitem"><span class="ms">group</span>Squad</div>
  </div>
</div>
<script>
const STAGES=[
 {name:"MAINSTAGE",color:"#FF5A36",sets:[{a:"Charlotte de Witte",s:"21:00",e:"23:00",fav:true,i:"CW"},{a:"Dimitri Vegas",s:"23:15",e:"01:00",i:"DV"},{a:"Steve Aoki",s:"01:15",e:"03:00",i:"SA"}]},
 {name:"FREEDOM",color:"#0EA5E9",sets:[{a:"Maceo Plex",s:"21:00",e:"22:45",i:"MP"},{a:"Adam Beyer",s:"23:00",e:"01:00",fav:true,i:"AB"},{a:"Pig&Dan",s:"01:30",e:"03:00",i:"PD"}]},
 {name:"CAGE",color:"#F59E0B",sets:[{a:"Lilly Palmer",s:"21:00",e:"22:30",i:"LP"},{a:"Amelie Lens",s:"23:15",e:"00:30",fav:true,i:"AL"},{a:"FJAAK",s:"00:45",e:"02:00",i:"FJ"}]},
 {name:"CORE",color:"#16A34A",sets:[{a:"Ben Böhmer",s:"21:00",e:"22:30",i:"BB"},{a:"Stephan Bodzin",s:"22:45",e:"00:15",i:"SB"},{a:"Reinier Z.",s:"00:30",e:"02:00",i:"RZ"}]},
 {name:"ELIXIR",color:"#7C3AED",sets:[{a:"Adriatique",s:"21:00",e:"23:00",i:"AD"},{a:"Tale Of Us",s:"23:15",e:"01:30",fav:true,i:"TU"},{a:"Innellea",s:"01:45",e:"03:00",i:"IN"}]},
 {name:"ROSE GARDEN",color:"#EC4899",sets:[{a:"Sofi Tukker",s:"21:00",e:"22:30",i:"ST"},{a:"Peggy Gou",s:"22:45",e:"00:30",fav:true,i:"PG"},{a:"Honey Dijon",s:"00:45",e:"02:30",i:"HD"}]},
 {name:"RISE",color:"#EAB308",sets:[{a:"Hardwell",s:"21:30",e:"23:30",i:"HW"},{a:"Martin Garrix",s:"23:45",e:"01:30",fav:true,i:"MG"}]},
 {name:"ATMOSPHERE",color:"#06B6D4",sets:[{a:"Boris Brejcha",s:"21:30",e:"23:15",i:"BR"},{a:"Solomun",s:"23:30",e:"01:30",i:"SO"}]}
];
const WIN_START=21*60,WIN_END=27*60,NOW=22*60+40;
const toMin=t=>{let[h,m]=t.split(":").map(Number);if(h<12)h+=24;return h*60+m;};
const pct=m=>(m-WIN_START)/(WIN_END-WIN_START)*100;
const body=document.getElementById("body");let html="";
STAGES.forEach((st,idx)=>{const favN=st.sets.filter(x=>x.fav).length;
  const liveSet=st.sets.find(x=>NOW>=toMin(x.s)&&NOW<toMin(x.e));
  let strip='<div class="strip">';
  st.sets.forEach(se=>{const l=pct(toMin(se.s)),w=pct(toMin(se.e))-l;strip+=`<div class="blk${se.fav?" fav":""}" style="left:${l}%;width:${w}%;background:${st.color}"></div>`;});
  strip+=`<div class="nl" style="left:${pct(NOW)}%"></div></div>`;
  let rows="";st.sets.forEach(se=>{rows+=`<div class="srow${se.fav?" fav":""}"><div class="photo">${se.i}</div><div style="flex:1;min-width:0"><div class="nm">${se.a}</div><div class="tm">${se.s} – ${se.e}</div></div><button class="heart"><span class="ms">${se.fav?"favorite":"favorite_border"}</span></button></div>`;});
  html+=`<div class="acc${idx===0?" open":""}"><div class="acc-head"><span class="pin" style="background:${st.color}"></span>
    <div style="min-width:0"><div class="nm" style="color:${st.color}">${st.name}</div><div class="sub">${st.sets.length} sets${favN?` · <b>${favN}★ favorite${favN>1?"s":""}</b>`:""}</div></div>
    ${liveSet?`<div class="now"><span class="d"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${liveSet.a}</span></div>`:""}
    <span class="ms chev">expand_more</span></div>
    <div class="acc-body">${strip}${rows}</div></div>`;});
body.innerHTML=html;
body.querySelectorAll(".acc-head").forEach(h=>h.addEventListener("click",()=>{const acc=h.closest(".acc");const open=acc.classList.contains("open");
  body.querySelectorAll(".acc").forEach(a=>a.classList.remove("open"));if(!open)acc.classList.add("open");}));
body.querySelectorAll(".heart").forEach(h=>h.addEventListener("click",e=>{e.stopPropagation();const r=h.closest(".srow");const on=r.classList.toggle("fav");h.querySelector(".ms").textContent=on?"favorite":"favorite_border";}));
</script>
</body>
</html>
