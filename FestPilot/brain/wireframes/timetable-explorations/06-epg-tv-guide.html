<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>T6 · EPG TV-Guide — FestPilot Timetable</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D09;--accent:#F5A623;--accent2:#FFD060;--ink:#F5F0E6;--muted:#9C9080;--glass:rgba(255,190,60,.06);--border:rgba(255,255,255,.1);--danger:#E0563B;--ok:#16A34A}
*{box-sizing:border-box}
body{background:#08070a;font-family:"Albert Sans",system-ui,sans-serif;color:var(--ink);margin:0}
.poster{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.ms{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 400;line-height:1}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none;-ms-overflow-style:none}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 50px 100px -30px rgba(245,166,35,.25);display:flex;flex-direction:column}
.head{padding:36px 18px 6px;flex-shrink:0}
.pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
.pill.ghost{background:var(--glass);border:1px solid var(--border);color:var(--ink)}
.pill.on{background:var(--accent);color:var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 22px;flex-shrink:0;background:rgba(15,13,9,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
.navitem{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer}
.navitem .ms{font-size:23px}.navitem.active{color:var(--accent)}

.epg-scroll{flex:1;min-height:0;overflow:auto;position:relative}
.epg-inner{width:824px;position:relative;padding-bottom:14px}
.epg-time{position:sticky;top:0;z-index:30;display:flex;height:26px;background:var(--bg)}
.epg-time .corner{position:sticky;left:0;z-index:31;width:64px;flex-shrink:0;background:var(--bg);display:flex;align-items:center;padding-left:12px;font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.1em}
.epg-time .scale{position:relative;width:760px;flex-shrink:0}
.epg-time .scale .t{position:absolute;top:7px;transform:translateX(-50%);font-size:9.5px;font-weight:700;color:var(--muted)}
.epg-time .scale .t.now{color:var(--accent)}
.erow{display:flex;height:48px}
.elabel{position:sticky;left:0;z-index:20;width:64px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 6px 0 12px;
  background:rgba(15,13,9,.96);backdrop-filter:blur(8px);border-right:1px solid var(--border);border-top:1px solid rgba(255,255,255,.04)}
.elabel .pin{width:7px;height:7px;border-radius:50%}
.elabel .nm{font-size:8.5px;font-weight:800;letter-spacing:.02em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etrack{position:relative;width:760px;flex-shrink:0;border-top:1px solid rgba(255,255,255,.04)}
.cell{position:absolute;top:5px;bottom:5px;border-radius:7px;padding:5px 6px;overflow:hidden;cursor:pointer;
  background:rgba(22,19,14,.66);border:1px solid rgba(255,255,255,.09);border-left:2px solid rgb(var(--c))}
.cell .cn{font-size:9.5px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .ct{font-size:8px;color:var(--muted);margin-top:1px}
.cell.fav{background:linear-gradient(135deg,rgba(255,216,128,.95),rgba(245,166,35,.82));color:#1a1205;border-color:rgba(255,222,150,.9);box-shadow:0 0 10px rgba(245,166,35,.35)}
.cell.fav .ct{color:#6a4a08}
.nowfull{position:absolute;top:26px;bottom:0;width:2px;background:var(--accent);z-index:25;box-shadow:0 0 8px rgba(245,166,35,.7)}
.nowfull::before{content:"NOW";position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:7.5px;font-weight:800;color:var(--bg);background:var(--accent);padding:1px 4px;border-radius:99px}
.epg-inner.filtered .cell:not(.fav){opacity:.16;filter:saturate(.3)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
<div class="phone">
  <div class="head">
    <div class="flex items-center justify-between">
      <h1 class="poster text-[22px] font-bold">Timetable</h1>
      <div class="flex gap-1.5"><span class="pill ghost" id="favT"><span class="ms text-[14px]">favorite</span>Favs</span><span class="pill on">Sat 18</span></div>
    </div>
    <p class="text-[11px] text-[var(--muted)] font-semibold mt-1 flex items-center gap-1"><span class="ms text-[14px]">grid_view</span>Whole night, all stages — TV-guide view</p>
  </div>
  <div class="epg-scroll" id="scroll"><div class="epg-inner" id="inner"></div></div>
  <div class="nav">
    <div class="navitem"><span class="ms">bolt</span>Now</div>
    <div class="navitem active"><span class="ms">calendar_month</span>Timetable</div>
    <div class="navitem"><span class="ms">event_available</span>My Plan</div>
    <div class="navitem"><span class="ms">map</span>Map</div>
    <div class="navitem"><span class="ms">group</span>Squad</div>
  </div>
</div>
<script>
const STAGES=[
 {name:"MAINSTAGE",color:"#FF5A36",sets:[{a:"Charlotte de Witte",s:"21:00",e:"23:00",fav:true},{a:"Dimitri Vegas",s:"23:15",e:"01:00"},{a:"Steve Aoki",s:"01:15",e:"03:00"}]},
 {name:"FREEDOM",color:"#0EA5E9",sets:[{a:"Maceo Plex",s:"21:00",e:"22:45"},{a:"Adam Beyer",s:"23:00",e:"01:00",fav:true},{a:"Pig&Dan",s:"01:30",e:"03:00"}]},
 {name:"CAGE",color:"#F59E0B",sets:[{a:"Lilly Palmer",s:"21:00",e:"22:30"},{a:"Amelie Lens",s:"23:15",e:"00:30",fav:true},{a:"FJAAK",s:"00:45",e:"02:00"}]},
 {name:"CORE",color:"#16A34A",sets:[{a:"Ben Böhmer",s:"21:00",e:"22:30"},{a:"Stephan Bodzin",s:"22:45",e:"00:15"},{a:"Reinier Z.",s:"00:30",e:"02:00"}]},
 {name:"ELIXIR",color:"#7C3AED",sets:[{a:"Adriatique",s:"21:00",e:"23:00"},{a:"Tale Of Us",s:"23:15",e:"01:30",fav:true},{a:"Innellea",s:"01:45",e:"03:00"}]},
 {name:"ROSE GDN",color:"#EC4899",sets:[{a:"Sofi Tukker",s:"21:00",e:"22:30"},{a:"Peggy Gou",s:"22:45",e:"00:30",fav:true},{a:"Honey Dijon",s:"00:45",e:"02:30"}]},
 {name:"RISE",color:"#EAB308",sets:[{a:"Hardwell",s:"21:30",e:"23:30"},{a:"Martin Garrix",s:"23:45",e:"01:30",fav:true}]},
 {name:"ATMOSPHERE",color:"#06B6D4",sets:[{a:"Boris Brejcha",s:"21:30",e:"23:15"},{a:"Solomun",s:"23:30",e:"01:30"}]}
];
const WIN_START=21*60,WIN_END=27*60,NOW=22*60+40,TRACK=760;
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)].join(",");
const toMin=t=>{let[h,m]=t.split(":").map(Number);if(h<12)h+=24;return h*60+m;};
const pct=m=>(m-WIN_START)/(WIN_END-WIN_START)*100;
const inner=document.getElementById("inner");
let scale="";for(let h=21;h<=27;h++){const isN=NOW>=h*60&&NOW<(h+1)*60;const edge=h===21?"transform:none;left:4px":`left:${pct(h*60)}%`;scale+=`<span class="t${isN?" now":""}" style="${edge}">${String(h%24).padStart(2,"0")}h</span>`;}
let html=`<div class="epg-time"><div class="corner">STAGE</div><div class="scale">${scale}</div></div>`;
STAGES.forEach(st=>{let cells="";st.sets.forEach(se=>{const l=pct(toMin(se.s)),w=pct(toMin(se.e))-l;
    cells+=`<div class="cell${se.fav?" fav":""}" style="--c:${rgb(st.color)};left:${l}%;width:calc(${w}% - 2px)"><div class="cn">${se.a}</div><div class="ct">${se.s}</div></div>`;});
  html+=`<div class="erow"><div class="elabel"><span class="pin" style="background:${st.color}"></span><span class="nm" style="color:${st.color}">${st.name}</span></div><div class="etrack">${cells}</div></div>`;});
html+=`<div class="nowfull" style="left:${64+TRACK*pct(NOW)/100}px"></div>`;
inner.innerHTML=html;
inner.querySelectorAll(".cell").forEach(c=>c.addEventListener("click",()=>{const on=c.classList.toggle("fav");}));
const favT=document.getElementById("favT");favT.addEventListener("click",()=>{const on=inner.classList.toggle("filtered");favT.classList.toggle("on",on);favT.classList.toggle("ghost",!on);});
</script>
</body>
</html>
