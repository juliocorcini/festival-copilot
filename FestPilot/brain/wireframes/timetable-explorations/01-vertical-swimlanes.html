<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>T1 · Vertical Swimlanes — FestPilot Timetable</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D09;--accent:#F5A623;--accent2:#FFD060;--ink:#F5F0E6;--muted:#9C9080;--glass:rgba(255,190,60,.06);--border:rgba(255,255,255,.1);--danger:#E0563B;--ok:#16A34A}
*{box-sizing:border-box}
body{background:#08070a;font-family:"Albert Sans",system-ui,sans-serif;color:var(--ink);margin:0}
.poster{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.ms{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 400;line-height:1}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none;-ms-overflow-style:none}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 50px 100px -30px rgba(245,166,35,.25);display:flex;flex-direction:column}
.head{padding:36px 18px 4px;flex-shrink:0}
.pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
.pill.ghost{background:var(--glass);border:1px solid var(--border);color:var(--ink)}
.pill.on{background:var(--accent);color:var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 22px;flex-shrink:0;background:rgba(15,13,9,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
.navitem{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer}
.navitem .ms{font-size:23px}.navitem.active{color:var(--accent)}

.cal{flex:1;min-height:0;overflow:hidden;position:relative}
.cal-scroll{height:100%;overflow:auto;position:relative;display:flex}
.gutter{position:sticky;left:0;z-index:20;width:42px;flex-shrink:0;padding-top:34px;
  background:linear-gradient(90deg,var(--bg) 72%,transparent)}
.gutter .gi{position:relative}
.gutter .hr{position:absolute;right:7px;transform:translateY(-50%);font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.gutter .hr.now{color:var(--accent)}
.lanes{display:flex;position:relative}
.lane{width:120px;flex-shrink:0;position:relative;border-left:1px solid rgba(255,255,255,.05)}
.lane-head{position:sticky;top:0;z-index:15;height:34px;display:flex;align-items:center;gap:6px;padding:0 9px;
  background:rgba(15,13,9,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.lane-head .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lane-head .nm{font-size:9.5px;font-weight:800;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane-body{position:relative}
.vset{position:absolute;left:5px;right:5px;border-radius:11px;padding:6px 8px;overflow:hidden;cursor:pointer;
  background:radial-gradient(120% 70% at 0 0,rgba(255,255,255,.10),transparent 50%),rgba(22,19,14,.62);
  border:1px solid rgba(255,255,255,.1);border-left:2px solid rgb(var(--c));
  backdrop-filter:blur(10px);box-shadow:0 6px 14px -10px rgba(0,0,0,.8)}
.vset .vn{font-size:11px;font-weight:700;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.vset .vt{font-size:9px;color:var(--muted);margin-top:2px}
.vset .vh{position:absolute;top:5px;right:5px;font-size:13px;color:var(--accent)}
.vset.fav{background:linear-gradient(135deg,rgba(255,216,128,.96),rgba(245,166,35,.86));color:#1a1205;border-color:rgba(255,222,150,.9);box-shadow:0 0 14px rgba(245,166,35,.3)}
.vset.fav .vt{color:#6a4a08}.vset.fav .vh{color:#8a4500}
.hrline{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.05);z-index:1}
.nowfull{position:absolute;left:42px;right:0;height:2px;background:var(--accent);z-index:12;box-shadow:0 0 10px rgba(245,166,35,.7)}
.hidden{display:none!important}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
<div class="phone">
  <div class="head">
    <div class="flex items-center justify-between">
      <h1 class="poster text-[22px] font-bold">Timetable</h1>
      <div class="flex gap-1.5"><span class="pill on">Sat 18</span><span class="pill ghost">Sun 19</span></div>
    </div>
    <div class="flex items-center justify-between mt-2.5">
      <span class="text-[11px] text-[var(--muted)] font-semibold flex items-center gap-1"><span class="ms text-[14px]">swap_vert</span>Time runs down · stages across</span>
      <span class="pill ghost" id="favT"><span class="ms text-[14px]">favorite</span>Only favs</span>
    </div>
  </div>
  <div class="cal"><div class="cal-scroll" id="scroll">
    <div class="gutter"><div class="gi" id="gutter"></div></div>
    <div class="lanes" id="lanes"></div>
  </div></div>
  <div class="nav">
    <div class="navitem"><span class="ms">bolt</span>Now</div>
    <div class="navitem active"><span class="ms">calendar_month</span>Timetable</div>
    <div class="navitem"><span class="ms">event_available</span>My Plan</div>
    <div class="navitem"><span class="ms">map</span>Map</div>
    <div class="navitem"><span class="ms">group</span>Squad</div>
  </div>
</div>
<script>
const STAGES=[
 {name:"MAINSTAGE",color:"#FF5A36",sets:[{a:"Charlotte de Witte",s:"21:00",e:"23:00",fav:true},{a:"Dimitri Vegas",s:"23:15",e:"01:00"},{a:"Steve Aoki",s:"01:15",e:"03:00"}]},
 {name:"FREEDOM",color:"#0EA5E9",sets:[{a:"Maceo Plex",s:"21:00",e:"22:45"},{a:"Adam Beyer",s:"23:00",e:"01:00",fav:true},{a:"Pig&Dan",s:"01:30",e:"03:00"}]},
 {name:"CAGE",color:"#F59E0B",sets:[{a:"Lilly Palmer",s:"21:00",e:"22:30"},{a:"Amelie Lens",s:"23:15",e:"00:30",fav:true},{a:"FJAAK",s:"00:45",e:"02:00"}]},
 {name:"CORE",color:"#16A34A",sets:[{a:"Ben Böhmer",s:"21:00",e:"22:30"},{a:"Stephan Bodzin",s:"22:45",e:"00:15"},{a:"Reinier Z.",s:"00:30",e:"02:00"}]},
 {name:"ELIXIR",color:"#7C3AED",sets:[{a:"Adriatique",s:"21:00",e:"23:00"},{a:"Tale Of Us",s:"23:15",e:"01:30",fav:true},{a:"Innellea",s:"01:45",e:"03:00"}]},
 {name:"ROSE GARDEN",color:"#EC4899",sets:[{a:"Sofi Tukker",s:"21:00",e:"22:30"},{a:"Peggy Gou",s:"22:45",e:"00:30",fav:true},{a:"Honey Dijon",s:"00:45",e:"02:30"}]},
 {name:"RISE",color:"#EAB308",sets:[{a:"Hardwell",s:"21:30",e:"23:30"},{a:"Martin Garrix",s:"23:45",e:"01:30",fav:true}]},
 {name:"ATMOSPHERE",color:"#06B6D4",sets:[{a:"Boris Brejcha",s:"21:30",e:"23:15"},{a:"Solomun",s:"23:30",e:"01:30"}]}
];
const WIN_START=21*60,WIN_END=27*60,NOW=22*60+40,PXH=104;
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)].join(",");
const toMin=t=>{let[h,m]=t.split(":").map(Number);if(h<12)h+=24;return h*60+m;};
const y=min=>(min-WIN_START)/60*PXH;
const TOTAL=y(WIN_END);
const fmt=t=>t;
const gutter=document.getElementById("gutter"),lanes=document.getElementById("lanes");
gutter.style.height=TOTAL+"px";
for(let h=21;h<=27;h++){const top=y(h*60);const isNow=NOW>=h*60&&NOW<(h+1)*60;
  const s=document.createElement("span");s.className="hr"+(isNow?" now":"");s.style.top=top+"px";s.textContent=String(h%24).padStart(2,"0")+":00";gutter.appendChild(s);}
STAGES.forEach(st=>{
  const lane=document.createElement("div");lane.className="lane";lane.dataset.fav=st.sets.some(x=>x.fav);
  const head=`<div class="lane-head"><span class="dot" style="background:${st.color}"></span><span class="nm" style="color:${st.color}">${st.name}</span></div>`;
  let body='<div class="lane-body" style="height:'+TOTAL+'px">';
  for(let h=21;h<=27;h++) body+=`<div class="hrline" style="top:${y(h*60)}px"></div>`;
  st.sets.forEach(se=>{const top=y(toMin(se.s)),hgt=y(toMin(se.e))-top;
    body+=`<div class="vset${se.fav?" fav":""}" data-fav="${!!se.fav}" style="--c:${rgb(st.color)};top:${top}px;height:${hgt}px">
      <div class="vn">${se.a}</div><div class="vt">${se.s}–${se.e}</div>
      <span class="vh ms">${se.fav?"favorite":"favorite_border"}</span></div>`;});
  body+="</div>";
  lane.innerHTML=head+body;lanes.appendChild(lane);
});
const now=document.createElement("div");now.className="nowfull";now.style.top=(34+y(NOW))+"px";
document.getElementById("scroll").appendChild(now);
document.querySelectorAll(".vh").forEach(h=>h.addEventListener("click",e=>{e.stopPropagation();
  const c=h.closest(".vset"),on=c.classList.toggle("fav");h.textContent=on?"favorite":"favorite_border";c.dataset.fav=on;
  const lane=c.closest(".lane");lane.dataset.fav=!!lane.querySelector('.vset[data-fav="true"]');applyFilter();}));
const favT=document.getElementById("favT");let only=false;
function applyFilter(){document.querySelectorAll(".lane").forEach(l=>l.classList.toggle("hidden",only&&l.dataset.fav!=="true"));
  document.querySelectorAll(".vset").forEach(v=>v.classList.toggle("hidden",only&&v.dataset.fav!=="true"));}
favT.addEventListener("click",()=>{only=!only;favT.classList.toggle("on",only);favT.classList.toggle("ghost",!only);applyFilter();});
</script>
</body>
</html>
