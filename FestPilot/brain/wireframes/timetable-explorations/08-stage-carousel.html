<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>T8 · Stage Carousel — FestPilot Timetable</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D09;--accent:#F5A623;--accent2:#FFD060;--ink:#F5F0E6;--muted:#9C9080;--glass:rgba(255,190,60,.06);--border:rgba(255,255,255,.1);--danger:#E0563B;--ok:#16A34A}
*{box-sizing:border-box}
body{background:#08070a;font-family:"Albert Sans",system-ui,sans-serif;color:var(--ink);margin:0}
.poster{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.ms{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 400;line-height:1}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none;-ms-overflow-style:none}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 50px 100px -30px rgba(245,166,35,.25);display:flex;flex-direction:column}
.head{padding:36px 16px 6px;flex-shrink:0}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 22px;flex-shrink:0;background:rgba(15,13,9,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
.navitem{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer}
.navitem .ms{font-size:23px}.navitem.active{color:var(--accent)}

.tabs{display:flex;gap:7px;overflow-x:auto;padding:8px 16px 6px;flex-shrink:0}
.tab{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;cursor:pointer;font-size:11px;font-weight:800;letter-spacing:.03em;
  background:var(--glass);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.tab .pin{width:8px;height:8px;border-radius:50%}
.tab.on{color:var(--ink)}

.stagewrap{flex:1;min-height:0;overflow:auto;padding:0 16px 16px}
.banner{position:relative;border-radius:22px;overflow:hidden;padding:18px 16px 16px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:4px}
.banner::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0 0,rgba(255,255,255,.18),transparent 55%)}
.banner .rel{position:relative;z-index:2}
.banner .of{font-size:10px;font-weight:800;letter-spacing:.1em;opacity:.85}
.banner .snm{font-family:"Oswald";font-size:32px;font-weight:700;line-height:.95;margin-top:2px}
.banner .meta{font-size:11px;font-weight:600;opacity:.85;margin-top:5px;display:flex;align-items:center;gap:6px}
.dots{display:flex;justify-content:center;gap:5px;margin:8px 0 12px}
.dots .o{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2)}
.dots .o.on{width:18px;border-radius:99px;background:var(--accent)}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:rgba(255,255,255,.1)}
.ev{position:relative;margin-bottom:11px}
.ev .node{position:absolute;left:-21px;top:16px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);z-index:2}
.evcard{display:flex;align-items:center;gap:11px;padding:11px;border-radius:16px;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),rgba(20,17,12,.5);border:1px solid var(--border);backdrop-filter:blur(12px)}
.evcard.live{border-color:rgba(245,166,35,.45)}
.evcard.fav{background:linear-gradient(135deg,rgba(245,166,35,.16),rgba(255,208,96,.03)),rgba(20,17,12,.55);border-color:rgba(245,166,35,.4)}
.evcard .photo{width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:linear-gradient(135deg,#3a3224,#241f16);color:#cbb78e;border:1px solid rgba(255,255,255,.12)}
.evcard.fav .photo{background:linear-gradient(135deg,#fff,#f1dca8);color:#7a5a10}
.evcard .nm{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evcard .tm{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;display:flex;align-items:center;gap:6px}
.evcard .badge{font-size:8.5px;font-weight:800;letter-spacing:.05em;padding:1px 7px;border-radius:99px}
.evcard .badge.now{color:#0F0D09;background:var(--accent)}
.evcard .badge.soon{color:var(--accent);border:1px solid rgba(245,166,35,.4)}
.evcard .badge.done{color:var(--muted);border:1px solid var(--border)}
.evcard .heart{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--glass);border:1px solid var(--border);color:var(--muted);margin-left:auto}
.evcard.fav .heart{color:var(--accent);border-color:rgba(245,166,35,.5)}
.evcard .heart .ms{font-size:18px}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
<div class="phone">
  <div class="head">
    <div class="flex items-center justify-between">
      <h1 class="poster text-[22px] font-bold">Timetable</h1>
      <span class="text-[11px] text-[var(--muted)] font-semibold flex items-center gap-1"><span class="ms text-[14px]">swipe</span>Swipe stages</span>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="stagewrap" id="wrap"></div>
  <div class="nav">
    <div class="navitem"><span class="ms">bolt</span>Now</div>
    <div class="navitem active"><span class="ms">calendar_month</span>Timetable</div>
    <div class="navitem"><span class="ms">event_available</span>My Plan</div>
    <div class="navitem"><span class="ms">map</span>Map</div>
    <div class="navitem"><span class="ms">group</span>Squad</div>
  </div>
</div>
<script>
const STAGES=[
 {name:"MAINSTAGE",color:"#FF5A36",sets:[{a:"Charlotte de Witte",s:"21:00",e:"23:00",fav:true,i:"CW"},{a:"Dimitri Vegas",s:"23:15",e:"01:00",i:"DV"},{a:"Steve Aoki",s:"01:15",e:"03:00",i:"SA"}]},
 {name:"FREEDOM",color:"#0EA5E9",sets:[{a:"Maceo Plex",s:"21:00",e:"22:45",i:"MP"},{a:"Adam Beyer",s:"23:00",e:"01:00",fav:true,i:"AB"},{a:"Pig&Dan",s:"01:30",e:"03:00",i:"PD"}]},
 {name:"CAGE",color:"#F59E0B",sets:[{a:"Lilly Palmer",s:"21:00",e:"22:30",i:"LP"},{a:"Amelie Lens",s:"23:15",e:"00:30",fav:true,i:"AL"},{a:"FJAAK",s:"00:45",e:"02:00",i:"FJ"}]},
 {name:"CORE",color:"#16A34A",sets:[{a:"Ben Böhmer",s:"21:00",e:"22:30",i:"BB"},{a:"Stephan Bodzin",s:"22:45",e:"00:15",i:"SB"},{a:"Reinier Z.",s:"00:30",e:"02:00",i:"RZ"}]},
 {name:"ELIXIR",color:"#7C3AED",sets:[{a:"Adriatique",s:"21:00",e:"23:00",i:"AD"},{a:"Tale Of Us",s:"23:15",e:"01:30",fav:true,i:"TU"},{a:"Innellea",s:"01:45",e:"03:00",i:"IN"}]},
 {name:"ROSE GARDEN",color:"#EC4899",sets:[{a:"Sofi Tukker",s:"21:00",e:"22:30",i:"ST"},{a:"Peggy Gou",s:"22:45",e:"00:30",fav:true,i:"PG"},{a:"Honey Dijon",s:"00:45",e:"02:30",i:"HD"}]},
 {name:"RISE",color:"#EAB308",sets:[{a:"Hardwell",s:"21:30",e:"23:30",i:"HW"},{a:"Martin Garrix",s:"23:45",e:"01:30",fav:true,i:"MG"}]},
 {name:"ATMOSPHERE",color:"#06B6D4",sets:[{a:"Boris Brejcha",s:"21:30",e:"23:15",i:"BR"},{a:"Solomun",s:"23:30",e:"01:30",i:"SO"}]}
];
const NOW=22*60+40;
const toMin=t=>{let[h,m]=t.split(":").map(Number);if(h<12)h+=24;return h*60+m;};
const mins=n=>n<60?n+" min":Math.floor(n/60)+"h"+String(n%60).padStart(2,"0");
let active=0;
const tabsEl=document.getElementById("tabs"),wrap=document.getElementById("wrap");
function tint(hex,a){return `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;}
function renderTabs(){tabsEl.innerHTML=STAGES.map((st,i)=>`<div class="tab${i===active?" on":""}" data-i="${i}" style="${i===active?`background:${tint(st.color,.18)};border-color:${tint(st.color,.5)}`:""}"><span class="pin" style="background:${st.color}"></span>${st.name}</div>`).join("");
  tabsEl.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{active=+t.dataset.i;render();}));}
function render(){renderTabs();const st=STAGES[active];const live=st.sets.find(x=>NOW>=toMin(x.s)&&NOW<toMin(x.e));
  const dots=STAGES.map((_,i)=>`<span class="o${i===active?" on":""}"></span>`).join("");
  let evs="";st.sets.forEach(se=>{const sm=toMin(se.s),em=toMin(se.e);let badge="";
    if(NOW>=sm&&NOW<em)badge='<span class="badge now">LIVE</span>';else if(sm>NOW)badge=`<span class="badge soon">in ${mins(sm-NOW)}</span>`;else badge='<span class="badge done">ended</span>';
    const cls=(NOW>=sm&&NOW<em)?"live":"";
    evs+=`<div class="ev"><span class="node" style="background:${st.color}"></span>
      <div class="evcard ${cls}${se.fav?" fav":""}"><div class="photo">${se.i}</div>
      <div style="min-width:0;flex:1"><div class="nm">${se.a}</div><div class="tm">${se.s} – ${se.e} ${badge}</div></div>
      <button class="heart"><span class="ms">${se.fav?"favorite":"favorite_border"}</span></button></div></div>`;});
  wrap.innerHTML=`<div class="banner" style="background:linear-gradient(150deg,${tint(st.color,.95)},${tint(st.color,.35)})">
      <div class="rel"><div class="of">STAGE ${active+1} OF ${STAGES.length}</div><div class="snm">${st.name}</div>
      <div class="meta"><span class="ms text-[14px]">${live?"graphic_eq":"schedule"}</span>${live?`Now: ${live.a}`:`${st.sets.length} sets tonight`}</div></div></div>
    <div class="dots">${dots}</div><div class="tl">${evs}</div>`;
  wrap.querySelectorAll(".heart").forEach(h=>h.addEventListener("click",e=>{e.stopPropagation();const c=h.closest(".evcard");const on=c.classList.toggle("fav");h.querySelector(".ms").textContent=on?"favorite":"favorite_border";}));
}
render();
</script>
</body>
</html>
