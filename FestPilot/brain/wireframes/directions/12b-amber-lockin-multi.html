<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>#12b Amber Glass — Lock in (multi-artist, 4 options)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D09;--accent:#F5A623;--accent2:#FFD060;--hot:#FF5D2E;--ink:#F5F0E6;--muted:#9C9080;--glass:rgba(255,190,60,.06);--border:rgba(255,255,255,.1)}
body{background:var(--bg);font-family:"Albert Sans",system-ui,sans-serif;color:var(--ink)}
.poster{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.ms{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 400}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;
  background:radial-gradient(ellipse 100% 50% at 50% 60%,rgba(255,93,46,.06),transparent 50%),var(--bg);
  box-shadow:0 50px 100px -30px rgba(245,166,35,.3)}
.glass{background:var(--glass);border:1px solid var(--border);border-radius:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.progress-pill{height:6px;border-radius:99px;background:rgba(255,255,255,.08)}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--hot))}
.pick-card{transition:transform .15s,box-shadow .15s}
.pick-card:hover{transform:scale(1.02);box-shadow:0 8px 24px -8px rgba(245,166,35,.3)}
.pick-card:active{transform:scale(0.98)}
.selected{border-color:var(--accent)!important;box-shadow:0 0 0 2px var(--accent),0 8px 24px -8px rgba(245,166,35,.3)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
<div class="phone flex flex-col">
  <div class="px-7 pt-4 pb-1 flex justify-between text-[12px] font-semibold">
    <button class="text-[var(--muted)] flex items-center gap-1"><span class="ms text-[16px]">list</span>All clashes</button>
    <span class="text-[var(--muted)]"><span class="ms text-[18px]">close</span></span>
  </div>

  <div class="px-7 pt-1 pb-1">
    <div class="flex items-center justify-between text-[11px] text-[var(--muted)] font-semibold mb-1.5"><span>LOCK IN</span><span>3 of 5 time slots</span></div>
    <div class="progress-pill"><div class="progress-fill" style="width:60%"></div></div>
  </div>

  <div class="text-center pt-4 pb-3">
    <div class="poster text-[13px] font-bold tracking-[.1em] text-[var(--muted)]">SÁB 18 · 23:00 – 00:30</div>
    <div class="text-[15px] font-bold mt-2" style="color:var(--accent)">4 favorites clash — pick one</div>
  </div>

  <!-- multi-option cards (scrollable stack) -->
  <div class="px-5 flex-1 overflow-auto space-y-3 pb-4">
    <button class="glass pick-card w-full p-4 text-left flex items-center gap-4">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center text-[18px] font-bold" style="background:rgba(245,158,11,.15);color:#F59E0B">1</div>
      <div class="flex-1">
        <div class="poster text-[18px] font-bold">Amelie Lens</div>
        <div class="flex items-center gap-2 mt-1 text-[12px] text-[var(--muted)] font-semibold"><span class="dot" style="background:#F59E0B"></span>CAGE</div>
        <div class="text-[11px] text-[var(--muted)] mt-1 italic">"Relentless techno energy"</div>
      </div>
      <span class="ms text-[24px] text-[var(--muted)]">radio_button_unchecked</span>
    </button>

    <button class="glass pick-card w-full p-4 text-left flex items-center gap-4">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center text-[18px] font-bold" style="background:rgba(59,130,246,.15);color:#3B82F6">2</div>
      <div class="flex-1">
        <div class="poster text-[18px] font-bold">Adam Beyer</div>
        <div class="flex items-center gap-2 mt-1 text-[12px] text-[var(--muted)] font-semibold"><span class="dot" style="background:#3B82F6"></span>FREEDOM</div>
        <div class="text-[11px] text-[var(--muted)] mt-1 italic">"Hypnotic driving layers"</div>
      </div>
      <span class="ms text-[24px] text-[var(--muted)]">radio_button_unchecked</span>
    </button>

    <button class="glass pick-card selected w-full p-4 text-left flex items-center gap-4">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center text-[18px] font-bold" style="background:rgba(217,70,239,.15);color:#D946EF">3</div>
      <div class="flex-1">
        <div class="poster text-[18px] font-bold">Tale Of Us</div>
        <div class="flex items-center gap-2 mt-1 text-[12px] text-[var(--muted)] font-semibold"><span class="dot" style="background:#D946EF"></span>ELIXIR</div>
        <div class="text-[11px] text-[var(--muted)] mt-1 italic">"Melodic, emotional, epic"</div>
      </div>
      <span class="ms text-[24px]" style="color:var(--accent)">check_circle</span>
    </button>

    <button class="glass pick-card w-full p-4 text-left flex items-center gap-4">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center text-[18px] font-bold" style="background:rgba(34,197,94,.15);color:#22C55E">4</div>
      <div class="flex-1">
        <div class="poster text-[18px] font-bold">Stephan Bodzin</div>
        <div class="flex items-center gap-2 mt-1 text-[12px] text-[var(--muted)] font-semibold"><span class="dot" style="background:#22C55E"></span>CORE</div>
        <div class="text-[11px] text-[var(--muted)] mt-1 italic">"Live synth mastery"</div>
      </div>
      <span class="ms text-[24px] text-[var(--muted)]">radio_button_unchecked</span>
    </button>
  </div>

  <!-- bottom action -->
  <div class="px-5 pb-8 pt-2 flex gap-3">
    <button class="flex-1 py-3.5 rounded-2xl font-bold text-[14px]" style="background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--bg)">Lock in Tale Of Us</button>
    <button class="py-3.5 px-4 rounded-2xl font-semibold text-[13px] text-[var(--muted)]" style="background:var(--glass);border:1px solid var(--border)"><span class="ms text-[16px] align-middle">content_cut</span></button>
  </div>
</div>
</body>
</html>
