<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>#14b Amber Glass — Onboarding v2 (no Tinder vibe)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D09;--accent:#F5A623;--accent2:#FFD060;--ink:#F5F0E6;--muted:#9C9080;--glass:rgba(255,190,60,.06);--border:rgba(255,255,255,.1);--dim:#3A3226}
body{background:var(--bg);font-family:"Albert Sans",system-ui,sans-serif;color:var(--ink)}
.poster{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.ms{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 400}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;
  background:radial-gradient(ellipse 120% 50% at 50% 15%,rgba(245,166,35,.08),transparent 50%),var(--bg);
  box-shadow:0 50px 100px -30px rgba(245,166,35,.3)}
.glass{background:var(--glass);border:1px solid var(--border);border-radius:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.art-card{width:100%;border-radius:28px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#1f1a12 0%,#2a2014 100%);border:1px solid var(--border);
  box-shadow:0 20px 50px -15px rgba(0,0,0,.6)}
.art-inner{display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
.swipe-hint{position:absolute;top:50%;right:16px;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.5}
.yes-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--bg);border:none;border-radius:16px;padding:14px 28px;font-size:15px;font-weight:800}
.nah-btn{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:14px 20px;font-size:15px;font-weight:700;color:var(--muted);backdrop-filter:blur(12px)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
<div class="phone flex flex-col">
  <div class="px-7 pt-4 pb-1 flex justify-between text-[12px] font-semibold"><span class="text-[var(--muted)]">14 of 87</span><button class="text-[var(--accent)] font-bold">Skip →</button></div>

  <!-- progress dots -->
  <div class="px-7 pt-1 pb-2">
    <div class="h-[4px] rounded-full bg-white/8 overflow-hidden"><div class="h-full rounded-full" style="background:linear-gradient(90deg,var(--accent),var(--accent2));width:16%"></div></div>
  </div>

  <div class="text-center pb-3">
    <div class="text-[14px] font-bold" style="color:var(--accent)">Would you see this set?</div>
    <div class="text-[12px] text-[var(--muted)] mt-1">Not final — just building your favorites list</div>
  </div>

  <!-- artist card (swipeable feel without Tinder buttons) -->
  <div class="px-5 flex-1 flex items-center">
    <div class="art-card" style="aspect-ratio:4/5">
      <div class="absolute inset-0 opacity-25" style="background:radial-gradient(circle at 60% 25%,rgba(245,166,35,.4),transparent 60%)"></div>
      <div class="art-inner h-full justify-between">
        <!-- top: stage/time -->
        <div class="flex items-center gap-2">
          <span class="dot" style="background:#F59E0B"></span>
          <span class="text-[12px] font-bold text-[var(--muted)]">CAGE · Sáb 23:15 – 00:30</span>
        </div>
        <!-- bottom: artist info -->
        <div>
          <div class="poster text-[38px] font-bold leading-[.95]">Amelie<br>Lens</div>
          <div class="flex gap-2 mt-3">
            <span class="text-[11px] px-2.5 py-1 rounded-full bg-white/8 text-[var(--muted)] font-semibold">Techno</span>
            <span class="text-[11px] px-2.5 py-1 rounded-full bg-white/8 text-[var(--muted)] font-semibold">Peak-time</span>
          </div>
          <div class="text-[12px] text-[var(--muted)] mt-2 italic">"Non-stop energy from start to finish"</div>
        </div>
      </div>

      <!-- subtle swipe indicator -->
      <div class="swipe-hint">
        <span class="ms text-[20px]">swipe_right</span>
        <span class="text-[9px] font-bold">SWIPE</span>
      </div>
    </div>
  </div>

  <!-- action buttons: NOT hearts/X, just text -->
  <div class="px-5 py-5 flex gap-3">
    <button class="nah-btn flex-1">Nah</button>
    <button class="yes-btn flex-[2]">I'd see this!</button>
  </div>

  <div class="text-center pb-6 text-[11px] text-[var(--muted)]">Swipe right or tap • Conflicts resolved later in <b style="color:var(--accent)">Lock in</b></div>
</div>
</body>
</html>
