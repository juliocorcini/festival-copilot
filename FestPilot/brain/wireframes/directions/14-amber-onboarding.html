<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>#14 Amber Glass — Onboarding Swipe</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D09;--accent:#F5A623;--accent2:#FFD060;--ink:#F5F0E6;--muted:#9C9080;--glass:rgba(255,190,60,.06);--border:rgba(255,255,255,.1);--skip:#E53E3E}
body{background:var(--bg);font-family:"Albert Sans",system-ui,sans-serif;color:var(--ink)}
.poster{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.ms{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 400}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;
  background:radial-gradient(ellipse 120% 60% at 50% 20%,rgba(245,166,35,.08),transparent 50%),var(--bg);
  box-shadow:0 50px 100px -30px rgba(245,166,35,.3)}
.glass{background:var(--glass);border:1px solid var(--border);border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.art-card{width:100%;aspect-ratio:3/4;border-radius:28px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#1f1a12 0%,#2a2014 100%);border:1px solid var(--border);
  box-shadow:0 20px 50px -15px rgba(0,0,0,.6)}
.art-card-inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;
  background:linear-gradient(180deg,transparent 40%,rgba(15,13,9,.85) 75%)}
.action-btn{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(12px);border:1.5px solid var(--border)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
<div class="phone flex flex-col">
  <div class="px-7 pt-4 pb-1 flex justify-between text-[12px] font-semibold"><span class="text-[var(--muted)]">14 of 87 artists</span><button class="text-[var(--accent)] font-bold">Skip all →</button></div>

  <div class="text-center pt-2 pb-3">
    <div class="poster text-[16px] font-bold" style="color:var(--accent)">WOULD YOU SEE THIS SET?</div>
    <div class="text-[12px] text-[var(--muted)] mt-1">Swipe right = yes · left = nah</div>
  </div>

  <!-- artist card -->
  <div class="px-6 flex-1 flex items-center">
    <div class="art-card">
      <!-- placeholder for artist photo -->
      <div class="absolute inset-0 opacity-30" style="background:radial-gradient(circle at 60% 30%,rgba(245,166,35,.3),transparent 60%)"></div>
      <div class="art-card-inner">
        <div class="poster text-[36px] font-bold leading-[.95]">Amelie<br>Lens</div>
        <div class="flex items-center gap-2 mt-2 text-[13px] font-semibold text-[var(--muted)]"><span class="dot" style="background:#F59E0B"></span>CAGE · Sáb 23:15</div>
        <div class="flex gap-2 mt-3">
          <span class="text-[11px] px-2.5 py-1 rounded-full bg-white/8 text-[var(--muted)] font-semibold">Techno</span>
          <span class="text-[11px] px-2.5 py-1 rounded-full bg-white/8 text-[var(--muted)] font-semibold">Peak-time</span>
        </div>
      </div>
    </div>
  </div>

  <!-- action buttons -->
  <div class="flex items-center justify-center gap-8 py-6">
    <button class="action-btn" style="background:rgba(229,62,62,.1)"><span class="ms text-[28px]" style="color:var(--skip)">close</span></button>
    <button class="action-btn" style="background:rgba(245,166,35,.15)"><span class="ms text-[28px]" style="color:var(--accent)">favorite</span></button>
  </div>

  <div class="text-center pb-8 text-[12px] text-[var(--muted)]">This isn't final — you'll decide conflicts later in <span class="font-bold" style="color:var(--accent)">Lock in</span></div>
</div>
</body>
</html>
