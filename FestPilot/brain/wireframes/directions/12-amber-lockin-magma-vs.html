<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>#12 Amber + Magma VS — Lock in Hybrid</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D09;--accent:#F5A623;--accent2:#FFD060;--hot:#FF5D2E;--ink:#F5F0E6;--muted:#9C9080;--glass:rgba(255,190,60,.06);--border:rgba(255,255,255,.1)}
body{background:var(--bg);font-family:"Albert Sans",system-ui,sans-serif;color:var(--ink)}
.poster{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.ms{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 400}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;
  background:radial-gradient(ellipse 100% 50% at 50% 50%,rgba(255,93,46,.08),transparent 50%),var(--bg);
  box-shadow:0 50px 100px -30px rgba(255,93,46,.25)}
.glass{background:var(--glass);border:1px solid var(--border);border-radius:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.vs{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;
  background:linear-gradient(135deg,var(--hot),var(--accent));color:#fff;box-shadow:0 0 40px rgba(255,93,46,.5),0 0 80px rgba(245,166,35,.2)}
.progress-pill{height:6px;border-radius:99px;background:rgba(255,255,255,.08)}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--hot))}
.card-glow{position:relative;overflow:hidden}
.card-glow::after{content:"";position:absolute;inset:0;border-radius:22px;opacity:0;transition:opacity .2s;background:radial-gradient(circle at 50% 100%,rgba(245,166,35,.08),transparent 60%)}
.card-glow:hover::after{opacity:1}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
<div class="phone flex flex-col">
  <div class="px-7 pt-4 pb-1 flex justify-between text-[12px] font-semibold"><span class="text-[var(--muted)]">3 of 8</span><span class="text-[var(--muted)]"><span class="ms text-[18px]">close</span></span></div>

  <div class="px-7 pt-1 pb-1">
    <div class="progress-pill"><div class="progress-fill" style="width:37.5%"></div></div>
  </div>

  <div class="text-center pt-5 pb-2">
    <div class="poster text-[14px] font-bold tracking-[.12em] text-[var(--muted)]">LOCK IN</div>
    <div class="text-[13px] text-[var(--muted)] mt-1">Sáb 18 · 23:00 – 00:30</div>
    <div class="text-[14px] font-bold mt-2" style="color:var(--accent)">Who gets the slot?</div>
  </div>

  <div class="px-5 flex-1 flex flex-col items-center justify-center gap-5">
    <button class="glass card-glow w-full p-5 text-left">
      <div class="poster text-[26px] font-bold leading-tight">Amelie Lens</div>
      <div class="flex items-center gap-2 mt-2 text-[13px] text-[var(--muted)] font-semibold"><span class="dot" style="background:#F59E0B"></span>CAGE</div>
      <div class="text-[12px] text-[var(--muted)] mt-2 italic">"Relentless techno. The crowd becomes one."</div>
      <div class="mt-3 flex items-center gap-2">
        <span class="text-[11px] px-2 py-0.5 rounded-full bg-white/8 text-[var(--muted)] font-semibold">Techno</span>
        <span class="text-[11px] px-2 py-0.5 rounded-full bg-white/8 text-[var(--muted)] font-semibold">Peak-time</span>
      </div>
    </button>

    <div class="vs">VS</div>

    <button class="glass card-glow w-full p-5 text-left">
      <div class="poster text-[26px] font-bold leading-tight">Adam Beyer</div>
      <div class="flex items-center gap-2 mt-2 text-[13px] text-[var(--muted)] font-semibold"><span class="dot" style="background:#3B82F6"></span>FREEDOM</div>
      <div class="text-[12px] text-[var(--muted)] mt-2 italic">"Hypnotic layers build and release."</div>
      <div class="mt-3 flex items-center gap-2">
        <span class="text-[11px] px-2 py-0.5 rounded-full bg-white/8 text-[var(--muted)] font-semibold">Techno</span>
        <span class="text-[11px] px-2 py-0.5 rounded-full bg-white/8 text-[var(--muted)] font-semibold">Driving</span>
      </div>
    </button>
  </div>

  <div class="px-7 pb-10 pt-4 flex items-center justify-between">
    <button class="text-[12px] text-[var(--muted)] font-semibold flex items-center gap-1"><span class="ms text-[18px]">content_cut</span>Split set</button>
    <button class="text-[12px] text-[var(--muted)] font-semibold flex items-center gap-1"><span class="ms text-[18px]">skip_next</span>Decide later</button>
  </div>
</div>
</body>
</html>
