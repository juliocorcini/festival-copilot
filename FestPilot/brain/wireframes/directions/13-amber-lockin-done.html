<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>#13 Amber Glass — Lock in Complete! 🎉</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D09;--accent:#F5A623;--accent2:#FFD060;--ink:#F5F0E6;--muted:#9C9080;--glass:rgba(255,190,60,.06);--border:rgba(255,255,255,.1)}
body{background:var(--bg);font-family:"Albert Sans",system-ui,sans-serif;color:var(--ink)}
.poster{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.ms{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 400}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;
  background:radial-gradient(ellipse 120% 80% at 50% 30%,rgba(245,166,35,.15),transparent 55%),var(--bg);
  box-shadow:0 50px 100px -30px rgba(245,166,35,.4)}
.glass{background:var(--glass);border:1px solid var(--border);border-radius:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.glow-ring{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(from 0deg,var(--accent),var(--accent2),var(--accent));
  box-shadow:0 0 60px rgba(245,166,35,.4),0 0 120px rgba(255,208,96,.15)}
.inner{width:130px;height:130px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
<div class="phone flex flex-col items-center justify-center px-8 text-center">
  <!-- celebration -->
  <div class="glow-ring">
    <div class="inner">
      <span class="ms text-[56px]" style="color:var(--accent)">check</span>
    </div>
  </div>

  <div class="poster text-[34px] font-bold mt-8 leading-tight" style="background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent">LOCKED IN!</div>
  <div class="text-[16px] text-[var(--muted)] mt-3 max-w-[260px]">Your Saturday plan is set. 6 artists, 0 conflicts.</div>

  <!-- summary -->
  <div class="glass w-full p-4 mt-8 text-left">
    <div class="text-[11px] font-bold tracking-[.14em] text-[var(--muted)] mb-2">YOUR SATURDAY</div>
    <div class="space-y-2">
      <div class="flex items-center gap-3 text-[13px]"><span style="width:8px;height:8px;border-radius:50%;background:#FF5A36;display:inline-block"></span><span class="font-semibold">Charlotte de Witte</span><span class="text-[var(--muted)]">21:00</span></div>
      <div class="flex items-center gap-3 text-[13px]"><span style="width:8px;height:8px;border-radius:50%;background:#F59E0B;display:inline-block"></span><span class="font-semibold">Amelie Lens</span><span class="text-[var(--muted)]">23:15</span></div>
      <div class="flex items-center gap-3 text-[13px]"><span style="width:8px;height:8px;border-radius:50%;background:#3B82F6;display:inline-block"></span><span class="font-semibold">Adam Beyer</span><span class="text-[var(--muted)]">00:30</span></div>
      <div class="flex items-center gap-3 text-[13px]"><span style="width:8px;height:8px;border-radius:50%;background:#D946EF;display:inline-block"></span><span class="font-semibold">Tale Of Us</span><span class="text-[var(--muted)]">02:45</span></div>
    </div>
  </div>

  <div class="flex gap-3 mt-8 w-full">
    <button class="flex-1 py-3 rounded-2xl font-bold text-[14px]" style="background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--bg)">View My Plan</button>
    <button class="glass py-3 px-5 rounded-2xl font-bold text-[14px] text-[var(--muted)]">Share</button>
  </div>
</div>
</body>
</html>
